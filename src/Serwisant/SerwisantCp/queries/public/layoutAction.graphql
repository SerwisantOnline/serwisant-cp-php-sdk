query {
    viewer: viewer {
        __typename
        subscriber {
            __typename
            businessActivity
            displayName
            taxPrefix
            taxId
            taxFormatted
            address {
                __typename
                street
                building
                city
                postalCode
                countryIso
            }
            serviceSupplier {
                __typename
                displayName
                address {
                    __typename
                    street
                    building
                    city
                    postalCode
                    countryIso
                }
                phone {
                    __typename
                    formatted
                }
                email
                avatar {
                    __typename
                    url
                }
            }
        }
    }
    customerAgreements: customerAgreements(filter: {types: [RULES, REFUND_POLICY, DATA_PROCESSING]}) {
        __typename
        description
        ID
    }
    customerStatements: customerStatements {
        __typename
        ID
        title
    }
    configuration: configuration {
        __typename
        panelEnabled
        panelRepairs
        panelTickets
        panelCommunication
        panelDevices
        panelDevicesRegistration
        panelSignups
        welcomeMessage
        dashboardMessage
        orderDictModel
        showOrderProgressInfo
        personalTransportEnabled
        internalTransportEnabled
        requirePhoneNumber
        uploadFiles
        uploadOnlyImages
        useCustomStatusNames
        ratings
        wallpaper
        currency
    }
}